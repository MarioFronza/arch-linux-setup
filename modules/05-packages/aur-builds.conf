# Nothing here reads the -debug split packages, and they collide when a source
# build is later swapped for its -bin twin. The last debug/!debug entry wins.
OPTIONS+=(!debug)

# makepkg defaults to `sudo -k`, which discards the cached credentials that
# install.sh keeps alive, so it would ask for the password again.
PACMAN_AUTH=(sudo)

# The package is installed right after it is built, so compressing it only
# costs time, most of all on the large binary ones (android sdk, burpsuite).
PKGEXT='.pkg.tar'
